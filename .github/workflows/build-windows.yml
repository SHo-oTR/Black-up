name: Windows Build & Release (Tauri 2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Kaynak Kodları Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust Toolchain Kurulumu (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Önbellekleme
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Bağımlılıkları Yükle
        run: npm install --legacy-peer-deps

      - name: Ön Yüzü Derle
        run: npm run build

      - name: Tauri CLI Kurulumu
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Testleri Çalıştır
        working-directory: ./src-tauri
        run: cargo test --verbose

      - name: Windows EXE ve NSIS Kurulum Paketi Üret
        run: cargo tauri build

      - name: Derlenen Windows EXE / MSI Dosyalarını Arşivle
        uses: actions/upload-artifact@v4
        with:
          name: RustAutoBackup-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/rust-auto-backup.exe
